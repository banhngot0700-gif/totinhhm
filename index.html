<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Tỏ Tình 💖</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      width:100%;
      height:100vh;
      overflow:hidden;

      display:flex;
      justify-content:center;
      align-items:center;

      background:linear-gradient(135deg,#ffd1e8,#ffe8f3);
    }

    .container{
      width:380px;
      background:white;

      padding:40px 30px;

      border-radius:30px;

      text-align:center;

      box-shadow:0 10px 30px rgba(0,0,0,0.15);

      position:relative;
    }

    .heart{
      font-size:70px;
      animation:heartBeat 1s infinite;
      margin-bottom:15px;
    }

    @keyframes heartBeat{
      0%{
        transform:scale(1);
      }

      50%{
        transform:scale(1.2);
      }

      100%{
        transform:scale(1);
      }
    }

    h1{
      color:#ff4f8b;
      font-size:30px;
      line-height:1.5;
      margin-bottom:60px;
    }

    .btn-box{
      display:flex;
      justify-content:center;
      gap:20px;
    }

    button{
      border:none;
      padding:14px 28px;

      font-size:18px;

      border-radius:50px;

      cursor:pointer;

      transition:0.3s;
    }

    #yesBtn{
      background:#ff4f8b;
      color:white;
    }

    #yesBtn:hover{
      transform:scale(1.1);
    }

    #noBtn{
      background:#dcdcdc;
      color:#333;

      position:relative;
    }

    #message{
      margin-top:35px;

      font-size:24px;

      color:#ff4f8b;

      font-weight:bold;

      min-height:40px;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="heart">💖</div>

    <h1>
      Anh có thích em không?
    </h1>

    <div class="btn-box">

      <button id="yesBtn">
        Thích 💕
      </button>

      <button id="noBtn">
        Không 😭
      </button>

    </div>

    <div id="message"></div>

  </div>

  <script>

    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");

    let clickCount = 0;

    const colors = [
      "#ff6b81",
      "#feca57",
      "#48dbfb",
      "#1dd1a1",
      "#5f27cd",
      "#ff9ff3"
    ];

    const shapes = [
      "50px",
      "0px",
      "50%",
      "10px 40px",
      "100px 20px",
      "30px"
    ];

    noBtn.addEventListener("click", () => {

      clickCount++;

      // random vị trí
      const randomX =
        Math.random() * (window.innerWidth - 150);

      const randomY =
        Math.random() * (window.innerHeight - 80);

      noBtn.style.position = "fixed";

      noBtn.style.left = randomX + "px";
      noBtn.style.top = randomY + "px";

      // random màu
      const randomColor =
        colors[Math.floor(Math.random() * colors.length)];

      noBtn.style.background = randomColor;

      // random hình dạng
      const randomShape =
        shapes[Math.floor(Math.random() * shapes.length)];

      noBtn.style.borderRadius = randomShape;

      // random xoay
      const randomRotate =
        Math.floor(Math.random() * 40) - 20;

      noBtn.style.transform =
        `rotate(${randomRotate}deg)`;

      // sau 10 lần thì biến mất
      if(clickCount >= 10){

        noBtn.style.display = "none";

        message.innerHTML =
          "Anh hết đường từ chối rồi 😳💖";
      }

    });

    yesBtn.addEventListener("click", () => {

      document.body.style.background =
        "linear-gradient(135deg,#ff758c,#ff7eb3)";

      message.innerHTML =
        "Em biết ngay màaaa 🥰💕";

    });

  </script>

</body>
</html>
